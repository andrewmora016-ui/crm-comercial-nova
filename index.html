<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Comercial Nova - Edición Directa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 via-purple-600 to-orange-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                    <i class="fa-solid fa-bolt text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 via-purple-300 to-orange-400 bg-clip-text text-transparent">COMERCIAL NOVA</h1>
                    <p class="text-xs text-slate-400 font-medium tracking-widest">DYNAMIC INNOVATION CRM</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs text-cyan-400 bg-cyan-500/10 border border-cyan-500/30 px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-pen-nib mr-1"></i> Edición Directa en Pantalla
                </span>
                <button onclick="resetearDatos()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition-all">
                    Restaurar Originales
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- GRAFICOS DINAMICOS -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Solicitudes por Estado</h3>
                <div class="w-48 h-48"><canvas id="estadoChart"></canvas></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Canal de Atención</h3>
                <div class="w-48 h-48"><canvas id="canalChart"></canvas></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Asesores Responsables</h3>
                <div class="w-48 h-48"><canvas id="asesorChart"></canvas></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tipos de Solicitud</h3>
                <div class="w-48 h-48"><canvas id="tipoChart"></canvas></div>
            </div>
        </section>

        <!-- TABLA Y CONTROLES -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-500"></i>
                    <input type="text" id="searchInput" onkeyup="filtrarTabla()" placeholder="Buscar por cliente, código o detalle..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-200 focus:border-cyan-500 outline-none">
                </div>
                <button onclick="agregarFila()" class="w-full md:w-auto bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Añadir Nueva Fila
                </button>
            </div>

            <!-- Tabla Interactiva -->
            <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="p-3">Código</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Canal</th>
                            <th class="p-3">Tipo</th>
                            <th class="p-3">Necesidad</th>
                            <th class="p-3">Asesor</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCrmBody" class="text-sm divide-y divide-slate-800/60">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- SCRIPT DE EDICIÓN EN VIVO -->
    <script>
        const datosOriginales = [
            { "Código de solicitud": "SOL-001", "Identificador del cliente": "C-001", "Canal de atención": "WhatsApp empresarial", "Tipo de solicitud": "Información de pedido", "Descripción de la necesidad": "Pedido CN-4587. Computador de $2.850.000 no llegó en fecha.", "Asesor responsable": "Sin asignar", "Estado de la solicitud": "Pendiente" },
            { "Código de solicitud": "SOL-002", "Identificador del cliente": "C-002", "Canal de atención": "Correo electrónico", "Tipo de solicitud": "Cotización empresarial", "Descripción de la necesidad": "Solicita cotización formal para 10 impresoras multifuncionales.", "Asesor responsable": "Sin asignar", "Estado de la solicitud": "Pendiente" },
            { "Código de solicitud": "SOL-003", "Identificador del cliente": "C-003", "Canal de atención": "Línea telefónica", "Tipo de solicitud": "Garantía y revisión técnica", "Descripción de la necesidad": "Factura FV-3815. Nevera presenta ruidos constantes.", "Asesor responsable": "Camila Ruiz", "Estado de la solicitud": "En proceso" },
            { "Código de solicitud": "SOL-004", "Identificador del cliente": "C-004", "Canal de atención": "Formulario web", "Tipo de solicitud": "Reclamo cobro duplicado", "Descripción de la necesidad": "Transacción TR-90871. Dos movimientos por el mismo valor.", "Asesor responsable": "Sergio Lopez", "Estado de la solicitud": "En proceso" },
            { "Código de solicitud": "SOL-005", "Identificador del cliente": "C-005", "Canal de atención": "Correo electrónico", "Tipo de solicitud": "Corrección de factura", "Descripción de la necesidad": "Factura FV-3912 con inconsistencias en identificación.", "Asesor responsable": "Paola Gomez", "Estado de la solicitud": "En espera de información" },
            { "Código de solicitud": "SOL-006", "Identificador del cliente": "C-006", "Canal de atención": "WhatsApp empresarial", "Tipo de solicitud": "Soporte técnico batería", "Descripción de la necesidad": "Pedido CN-4492. Duración de batería inferior a la esperada.", "Asesor responsable": "Natalia Castro", "Estado de la solicitud": "En espera de información" },
            { "Código de solicitud": "SOL-007", "Identificador del cliente": "C-007", "Canal de atención": "Presencial", "Tipo de solicitud": "Garantía y reemplazo", "Descripción de la necesidad": "Factura FV-3746. Mouse inalámbrico dejó de funcionar.", "Asesor responsable": "Julian Herrera", "Estado de la solicitud": "Cerrada" },
            { "Código de solicitud": "SOL-008", "Identificador del cliente": "C-008", "Canal de atención": "Chat web", "Tipo de solicitud": "Instalación de software", "Descripción de la necesidad": "Pedido CN-4418. Problema completando licencia de software.", "Asesor responsable": "Andres Rojas", "Estado de la solicitud": "Cerrada" }
        ];

        let datosCRM = JSON.parse(localStorage.getItem('crm_nova_datos')) || datosOriginales;
        let charts = {};

        function renderizarTabla(datos) {
            const tbody = document.getElementById('tablaCrmBody');
            tbody.innerHTML = '';
            
            datos.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/50 transition-colors';
                tr.innerHTML = `
                    <td class="p-3"><input type="text" value="${row['Código de solicitud']}" onchange="actualizarCelda(${index}, 'Código de solicitud', this.value)" class="w-24 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs font-mono font-bold text-cyan-400 outline-none focus:border-cyan-500"></td>
                    <td class="p-3"><input type="text" value="${row['Identificador del cliente']}" onchange="actualizarCelda(${index}, 'Identificador del cliente', this.value)" class="w-24 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white outline-none focus:border-cyan-500"></td>
                    <td class="p-3">
                        <select onchange="actualizarCelda(${index}, 'Canal de atención', this.value)" class="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-300 outline-none focus:border-cyan-500">
                            <option value="WhatsApp empresarial" ${row['Canal de atención']=='WhatsApp empresarial'?'selected':''}>WhatsApp empresarial</option>
                            <option value="Correo electrónico" ${row['Canal de atención']=='Correo electrónico'?'selected':''}>Correo electrónico</option>
                            <option value="Línea telefónica" ${row['Canal de atención']=='Línea telefónica'?'selected':''}>Línea telefónica</option>
                            <option value="Formulario web" ${row['Canal de atención']=='Formulario web'?'selected':''}>Formulario web</option>
                            <option value="Presencial" ${row['Canal de atención']=='Presencial'?'selected':''}>Presencial</option>
                            <option value="Chat web" ${row['Canal de atención']=='Chat web'?'selected':''}>Chat web</option>
                        </select>
                    </td>
                    <td class="p-3"><input type="text" value="${row['Tipo de solicitud']}" onchange="actualizarCelda(${index}, 'Tipo de solicitud', this.value)" class="w-32 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white outline-none focus:border-cyan-500"></td>
                    <td class="p-3"><input type="text" value="${row['Descripción de la necesidad']}" onchange="actualizarCelda(${index}, 'Descripción de la necesidad', this.value)" class="w-64 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-slate-300 outline-none focus:border-cyan-500"></td>
                    <td class="p-3"><input type="text" value="${row['Asesor responsable']}" onchange="actualizarCelda(${index}, 'Asesor responsable', this.value)" class="w-28 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-purple-300 outline-none focus:border-cyan-500"></td>
                    <td class="p-3">
                        <select onchange="actualizarCelda(${index}, 'Estado de la solicitud', this.value)" class="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs font-semibold text-white outline-none focus:border-cyan-500">
                            <option value="Pendiente" ${row['Estado de la solicitud']=='Pendiente'?'selected':''}>Pendiente</option>
                            <option value="En proceso" ${row['Estado de la solicitud']=='En proceso'?'selected':''}>En proceso</option>
                            <option value="En espera de información" ${row['Estado de la solicitud']=='En espera de información'?'selected':''}>En espera</option>
                            <option value="Cerrada" ${row['Estado de la solicitud']=='Cerrada'?'selected':''}>Cerrada</option>
                        </select>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="eliminarFila(${index})" class="bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500 hover:text-white p-1.5 rounded-lg text-xs transition-all" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function actualizarCelda(index, campo, valor) {
            datosCRM[index][campo] = valor;
            localStorage.setItem('crm_nova_datos', JSON.stringify(datosCRM));
            actualizarGraficos(datosCRM);
        }

        function agregarFila() {
            const nueva = {
                "Código de solicitud": `SOL-00${datosCRM.length + 1}`,
                "Identificador del cliente": "C-009",
                "Canal de atención": "WhatsApp empresarial",
                "Tipo de solicitud": "Nueva consulta",
                "Descripción de la necesidad": "Escriba aquí los detalles...",
                "Asesor responsable": "Sin asignar",
                "Estado de la solicitud": "Pendiente"
            };
            datosCRM.unshift(nueva);
            localStorage.setItem('crm_nova_datos', JSON.stringify(datosCRM));
            renderizarTabla(datosCRM);
            actualizarGraficos(datosCRM);
        }

        function eliminarFila(index) {
            if (confirm('¿Deseas eliminar este registro?')) {
                datosCRM.splice(index, 1);
                localStorage.setItem('crm_nova_datos', JSON.stringify(datosCRM));
                renderizarTabla(datosCRM);
                actualizarGraficos(datosCRM);
            }
        }

        function resetearDatos() {
            if (confirm('¿Deseas restaurar los casos originales?')) {
                datosCRM = [...datosOriginales];
                localStorage.removeItem('crm_nova_datos');
                renderizarTabla(datosCRM);
                actualizarGraficos(datosCRM);
            }
        }

        function actualizarGraficos(datos) {
            const estados = {}, canales = {}, asesores = {}, tipos = {};

            datos.forEach(d => {
                estados[d['Estado de la solicitud']] = (estados[d['Estado de la solicitud']] || 0) + 1;
                canales[d['Canal de atención']] = (canales[d['Canal de atención']] || 0) + 1;
                asesores[d['Asesor responsable']] = (asesores[d['Asesor responsable']] || 0) + 1;
                tipos[d['Tipo de solicitud']] = (tipos[d['Tipo de solicitud']] || 0) + 1;
            });

            renderChart('estadoChart', 'doughnut', Object.keys(estados), Object.values(estados));
            renderChart('canalChart', 'bar', Object.keys(canales), Object.values(canales));
            renderChart('asesorChart', 'bar', Object.keys(asesores), Object.values(asesores), true);
            renderChart('tipoChart', 'pie', Object.keys(tipos), Object.values(tipos));
        }

        function renderChart(canvasId, type, labels, data, horizontal = false) {
            if (charts[canvasId]) charts[canvasId].destroy();
            const ctx = document.getElementById(canvasId).getContext('2d');
            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#0066FF', '#8A2BE2', '#00F2FE', '#F59E0B', '#10B981', '#EC4899', '#6366F1']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: horizontal ? 'y' : 'x',
                    plugins: { legend: { display: type !== 'bar', position: 'bottom', labels: { color: '#94a3b8', boxWidth: 6, font: { size: 8 } } } },
                    scales: type !== 'doughnut' && type !== 'pie' ? { x: { ticks: { color: '#94a3b8', font: { size: 9 } } }, y: { ticks: { color: '#94a3b8', font: { size: 9 } } } } : {}
                }
            });
        }

        function filtrarTabla() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = datosCRM.filter(d => 
                d['Código de solicitud'].toLowerCase().includes(texto) ||
                d['Identificador del cliente'].toLowerCase().includes(texto) ||
                d['Descripción de la necesidad'].toLowerCase().includes(texto) ||
                d['Asesor responsable'].toLowerCase().includes(texto)
            );
            renderizarTabla(filtrados);
        }

        // Inicializar
        renderizarTabla(datosCRM);
        actualizarGraficos(datosCRM);
    </script>
</body>
</html>
