<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Comercial Nova - Dinámico</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para gráficos dinámicos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <!-- HEADER CON LOGO DE COMERCIAL NOVA -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 via-purple-600 to-orange-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                    <i class="fa-solid fa-bolt text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 via-purple-300 to-orange-400 bg-clip-text text-transparent">COMERCIAL NOVA</h1>
                    <p class="text-xs text-slate-400 font-medium tracking-widest">DYNAMIC INNOVATION CRM</p>
                </div>
            </div>
            
            <!-- Selector Multi-Empresa -->
            <div class="flex items-center gap-3 bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400">Empresa Activa:</span>
                <select id="empresaSelector" class="bg-slate-900 text-cyan-400 font-bold text-sm rounded px-2 py-1 outline-none border border-slate-700">
                    <option value="ANDRÉS">Comercial Nova (Principal)</option>
                    <option value="SUCURSAL_MED">Sucursal Medellín</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- DASHBOARD DE GRAFICOS DINAMICOS -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Solicitudes por Estado</h3>
                <div class="w-48 h-48"><canvas id="estadoChart"></canvas></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Canal de Atención</h3>
                <div class="w-48 h-48"><canvas id="canalChart"></canvas></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Asesores Responsables</h3>
                <div class="w-48 h-48"><canvas id="asesorChart"></canvas></div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col items-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tipos de Solicitud</h3>
                <div class="w-48 h-48"><canvas id="tipoChart"></canvas></div>
            </div>
        </section>

        <!-- PANEL DE CONTROL Y TABLA -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-500"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por cliente, código o detalle..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-200 focus:border-cyan-500 outline-none">
                </div>
                <button onclick="abrirModalNuevo()" class="w-full md:w-auto bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Registrar Nueva Solicitud
                </button>
            </div>

            <!-- Tabla de Datos -->
            <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-left border-collapse" id="crmTable">
                    <thead>
                        <tr class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="p-3">Código</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Canal</th>
                            <th class="p-3">Tipo</th>
                            <th class="p-3">Necesidad</th>
                            <th class="p-3">Asesor</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCrmBody" class="text-sm divide-y divide-slate-800/60">
                        <!-- Los datos se cargan dinámicamente desde Supabase -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- SCRIPT DE CONEXIÓN A SUPABASE Y LÓGICA -->
    <script>
        // REEMPLAZA ESTOS DATOS CON LOS DE TU PROYECTO DE SUPABASE (Settings -> API)
        const SUPABASE_URL = 'qxnapfrtkuotqugnaloi';
        const SUPABASE_KEY = 'us-east-1';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let tablaActiva = 'ANDREA';
        let datosCRM = [];
        let charts = {};

        async function cargarDatos() {
            const { data, error } = await supabaseClient.from(tablaActiva).select('*');
            if (error) {
                console.error('Error al cargar datos:', error);
                return;
            }
            datosCRM = data || [];
            renderizarTabla(datosCRM);
            actualizarGraficos(datosCRM);
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('tablaCrmBody');
            tbody.innerHTML = '';
            
            datos.forEach(row => {
                let badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                if (row['Estado de la solicitud'] === 'Cerrada') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                if (row['Estado de la solicitud'] === 'En proceso') badgeColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/50 transition-colors';
                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold text-cyan-400">${row['Código de solicitud'] || ''}</td>
                    <td class="p-3">${row['Identificador del cliente'] || ''}</td>
                    <td class="p-3 text-slate-300 text-xs">${row['Canal de atención'] || ''}</td>
                    <td class="p-3 text-slate-300 text-xs">${row['Tipo de solicitud'] || ''}</td>
                    <td class="p-3 text-slate-400 text-xs max-w-xs truncate">${row['Descripción de la necesidad'] || ''}</td>
                    <td class="p-3 text-xs">${row['Asesor responsable'] || ''}</td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeColor}">${row['Estado de la solicitud'] || ''}</span></td>
                    <td class="p-3 text-center">
                        <button onclick="alert('Detalle de solicitud: ${row['Código de solicitud']}')" class="text-slate-400 hover:text-cyan-400 p-1"><i class="fa-solid fa-eye"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function actualizarGraficos(datos) {
            // Contadores simples para gráficos
            const estados = {};
            const canales = {};
            const asesores = {};

            datos.forEach(d => {
                const est = d['Estado de la solicitud'] || 'Sin estado';
                estados[est] = (estados[est] || 0) + 1;

                const can = d['Canal de atención'] || 'Otro';
                canales[can] = (canales[can] || 0) + 1;

                const ase = d['Asesor responsable'] || 'Sin asignar';
                asesores[ase] = (asesores[ase] || 0) + 1;
            });

            // Render Estado Chart
            renderChart('estadoChart', 'doughnut', Object.keys(estados), Object.values(estados));
            renderChart('canalChart', 'bar', Object.keys(canales), Object.values(canales));
            renderChart('asesorChart', 'bar', Object.keys(asesores), Object.values(asesores), true);
        }

        function renderChart(canvasId, type, labels, data, horizontal = false) {
            if (charts[canvasId]) charts[canvasId].destroy();
            const ctx = document.getElementById(canvasId).getContext('2d');
            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#0066FF', '#8A2BE2', '#00F2FE', '#F59E0B', '#10B981']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: horizontal ? 'y' : 'x',
                    plugins: { legend: { display: type === 'doughnut', position: 'bottom', labels: { color: '#94a3b8', boxWidth: 10 } } },
                    scales: type !== 'doughnut' ? { x: { ticks: { color: '#94a3b8', font: { size: 10 } } }, y: { ticks: { color: '#94a3b8', font: { size: 10 } } } } : {}
                }
            });
        }

        // Inicializar carga
        cargarDatos();
    </script>
</body>
</html>
